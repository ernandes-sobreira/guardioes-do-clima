<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f7fafb"><title>VI SAPI 2026 · Avaliação de Pitches</title>
<style>
:root{--bg:#f6f9fb;--ink:#142b35;--muted:#647981;--line:#dfe8ed;--blue:#176e91;--violet:#553378;--soft:#e9f5f9;--green:#18795c;--yellow:#ffefd4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:15px}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.52;cursor:not-allowed}header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}header .inner{max-width:1180px;margin:auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:16px}.unemat{background:#173c45;border-radius:9px;padding:8px 12px;display:flex;align-items:center;justify-content:center}.unemat img{width:140px;max-height:42px;object-fit:contain}.mark{width:113px;display:block;min-height:24px;object-fit:contain}.subbrand{border-left:1px solid var(--line);padding-left:14px;color:var(--muted);font-size:12px;line-height:1.4}.subbrand strong{font-size:14px;color:var(--ink)}main{max-width:1180px;margin:28px auto;padding:0 20px 80px}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(24px,3vw,35px);letter-spacing:-.8px}h2{font-size:21px}p{line-height:1.55}.muted{color:var(--muted)}.small{font-size:12px}.kicker{text-transform:uppercase;font-size:11px;letter-spacing:1.2px;font-weight:800;color:var(--blue)}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 5px 24px #12303e08}.login{max-width:460px;margin:12vh auto 0;text-align:left}.login h1{font-size:30px}.field{width:100%;padding:13px 14px;border:1px solid #cfdee5;border-radius:10px;outline:none;background:white;color:var(--ink)}.field:focus{border-color:var(--blue);box-shadow:0 0 0 3px #c9e8f4}.btn{border:none;border-radius:10px;padding:11px 17px;font-weight:700;background:var(--blue);color:#fff}.btn:hover{filter:brightness(.96)}.btn.secondary{background:white;border:1px solid #cfdee5;color:var(--ink)}.btn.danger{background:#a64141}.btn.success{background:var(--green)}.btn.smallbtn{padding:7px 12px;font-size:13px}.pill{display:inline-block;padding:5px 10px;border-radius:99px;font-size:12px;font-weight:700;background:#eaf4f8;color:var(--blue)}.pill.done{background:#e6f4ee;color:var(--green)}.pill.wait{background:#fff1da;color:#946113}.filters{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.filters input{flex:1;min-width:190px}.filters select{max-width:220px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:22px 0}.stat{background:white;border:1px solid var(--line);border-radius:14px;padding:20px}.stat strong{display:block;font-size:31px;font-weight:800;letter-spacing:-1px}.stat span{display:block;color:var(--muted);font-size:13px}.progress{height:7px;background:#e4eef1;border-radius:9px;overflow:hidden;margin:6px 0 15px}.progress i{display:block;height:100%;background:var(--blue);transition:width .2s}.list{display:grid;gap:11px}.work{padding:18px 20px;border:1px solid var(--line);background:#fff;border-radius:13px;display:flex;align-items:center;justify-content:space-between;gap:16px}.work .meta{display:flex;gap:7px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:12px;margin-bottom:7px}.work h3{font-size:15px;margin:0 0 8px;line-height:1.35}.work p{margin:0;color:var(--muted);font-size:13px}.work .actions{flex-shrink:0;text-align:right}.score{font-size:21px;font-weight:800}.questions{display:grid;gap:14px;margin:20px 0}.question{padding:15px;border:1px solid var(--line);border-radius:12px}.question .qtitle{font-weight:750;margin-bottom:12px}.choices{display:flex;gap:8px;flex-wrap:wrap}.choice{width:46px;height:44px;border:1px solid #d0dfe5;background:#fff;border-radius:10px;color:var(--ink);font-weight:800}.choice[aria-pressed=true]{background:var(--blue);color:white;border-color:var(--blue);box-shadow:0 0 0 3px #d4eef8}.modalwrap{position:fixed;inset:0;background:#0d2229a0;z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:3vh 14px}.modal{background:white;border-radius:17px;max-width:720px;width:100%;margin:auto;padding:25px;box-shadow:0 20px 85px #071d2560}.modal .top{border-bottom:1px solid var(--line);padding-bottom:10px}.modal h2{line-height:1.35;font-size:22px}.modal textarea{min-height:75px;resize:vertical}.alert{border-radius:10px;padding:12px 14px;background:#fff2d9;color:#835c13;margin:14px 0}.error{background:#ffeded;color:#a03939}.ok{background:#e8f7ed;color:var(--green)}.tablewrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:13px}table{border-collapse:collapse;width:100%;min-width:810px}th{text-align:left;color:var(--muted);font-weight:700;font-size:12px;background:#f9fbfc}th,td{border-bottom:1px solid var(--line);padding:13px 11px;vertical-align:top}td{font-size:13px}tr:last-child td{border-bottom:0}.link{background:none;border:0;color:var(--blue);text-decoration:underline;font-weight:700;padding:0;text-align:left}.right{text-align:right}.hidden{display:none!important}.foot{margin-top:18px;color:var(--muted);font-size:12px}.notice{border:1px solid var(--line);background:#fff;border-radius:11px;padding:14px 16px;margin:17px 0;font-size:13px}.actionsbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.empty{text-align:center;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:45px;color:var(--muted)}@media(max-width:670px){header .inner{padding:9px 12px}.brand{gap:8px}.unemat img{width:88px}.mark{width:85px}.subbrand{display:none}main{padding:0 12px;margin:22px auto}.stats{grid-template-columns:repeat(2,1fr)}.work{align-items:flex-start;flex-direction:column}.work .actions{text-align:left}.box{padding:19px}.modal{padding:17px}.choice{flex:1;min-width:42px}.filters input{width:100%}.filters select{max-width:none;flex:1}}
</style></head><body>

info" class="small muted"></div></div></header>
<main><div id="app"></div></main><div id="overlay" class="hidden"></div>
<script>
'use strict';
const API='https://vztdhteljfmgrbpwilik.supabase.co/functions/v1/sapi26-avaliacao';
const key='sapi26_token';
let token=localStorage.getItem(key)||'',state=null,filterText='',filterGroup='todos',filterStatus='todos',opened=null;
const $=id=>document.getElementById(id);
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const numeric=n=>Number(n).toLocaleString('pt-BR',{maximumFractionDigits:1});
async function request(action,payload={}){let res;try{res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,token,...payload}),cache:'no-store'});}catch(e){throw new Error('Sem conexão com o servidor. Confira sua internet.');}let data;try{data=await res.json()}catch(e){throw new Error('O servidor não respondeu corretamente.')}if(!res.ok)throw new Error(data.error||'Falha de comunicação.');return data;}
function notify(msg,bad=false){const e=$('toast');if(e)e.remove();const el=document.createElement('div');el.id='toast';el.setAttribute('role','status');el.style.cssText=`position:fixed;bottom:22px;right:20px;max-width:340px;z-index:100;box-shadow:0 8px 40px #1a304c34;border-radius:12px;padding:14px 18px;background:${bad?'#b14444':'#197254'};color:white;font-weight:700`;el.textContent=msg;document.body.append(el);setTimeout(()=>el.remove(),4000)}
function logout(){if(token)request('logout').catch(()=>{});token='';state=null;localStorage.removeItem(key);filterText='';$('overlay').className='hidden';renderLogin();}
function renderLogin(err=''){$('userinfo').innerHTML='';$('app').innerHTML=`<div class="login box"><div class="kicker">Acesso restrito · SAPI 2026</div><h1>Avaliação de pitches</h1><p class="muted">Entre com seu código individual. Você verá somente os trabalhos designados para sua avaliação.</p><form id="loginform"><label for="loginCode" style="display:block;font-weight:700;margin:20px 0 8px">Seu código de acesso</label><input id="loginCode" class="field" type="text" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="SAPI-XXXXX-XXXXX-XXXXX" maxlength="30" required><div id="loginErr" class="${err?'alert error':'hidden'}">${h(err)}</div><button id="loginBtn" class="btn" style="width:100%;margin-top:14px">Entrar no sistema</button></form><p class="foot">O código é pessoal. Não compartilhe com outros avaliadores.</p></div>`;$('loginform').addEventListener('submit',async e=>{e.preventDefault();const b=$('loginBtn');b.disabled=true;b.textContent='Verificando...';try{const data=await request('login',{code:$('loginCode').value});token=data.token;localStorage.setItem(key,token);await refresh();}catch(e){$('loginErr').textContent=e.message;$('loginErr').className='alert error';b.disabled=false;b.textContent='Entrar no sistema';}})}
async function refresh(silent=false){if(!token){renderLogin();return;}try{state=await request('state');render();}catch(e){if(/Sessão expirada/.test(e.message)){logout();return;}if(!silent){$('app').innerHTML=`<div class="box"><p>${h(e.message)}</p><button class="btn" onclick="refresh()">Tentar novamente</button></div>`;}}}
function commonHeader(){const u=state.user;$('userinfo').innerHTML=`<span class="muted">${h(u.nome)}</span> <button id="exit" class="btn secondary smallbtn" style="margin-left:8px">Sair</button>`;$('exit').onclick=logout;}
function render(){if(!state)return renderLogin();commonHeader();if(state.user.papel==='coordenacao')renderCoord();else renderReviewer();}
function filtered(works,scoreFn){return works.filter(w=>{const q=filterText.toLocaleLowerCase('pt-BR');return (!q||[w.titulo,w.autor,String(w.id)].some(x=>String(x).toLocaleLowerCase('pt-BR').includes(q)))&&(filterGroup==='todos'||w.grupo===filterGroup)&&(filterStatus==='todos'||scoreFn(w)===filterStatus);});}
function searchBar(){return `<div class="filters"><input id="search" class="field" type="search" placeholder="Buscar título, estudante ou inscrição" value="${h(filterText)}"><select id="group" class="field"><option value="todos">Todos os grupos</option>${['A','B','C'].map(g=>`<option value="${g}" ${filterGroup===g?'selected':''}>Grupo ${g}</option>`).join('')}</select><select id="status" class="field"><option value="todos">Todos os status</option><option value="pendente" ${filterStatus==='pendente'?'selected':''}>Pendentes</option><option value="concluido" ${filterStatus==='concluido'?'selected':''}>Concluídos</option></select></div>`}
function wireSearch(callback){$('search').oninput=e=>{filterText=e.target.value;callback();};$('group').onchange=e=>{filterGroup=e.target.value;callback();};$('status').onchange=e=>{filterStatus=e.target.value;callback();}}
function stat(label,value){return `<div class="stat"><strong>${h(value)}</strong><span>${h(label)}</span></div>`}
function renderReviewer(){const map=new Map(state.grades.map(g=>[g.trabalho_id,g]));const done=map.size;let works=state.works||[];$('app').innerHTML=`<div class="top"><div><div class="kicker">Área da avaliadora</div><h1>Meus trabalhos</h1><p class="muted">Quatro notas de 0 a 5. Simples, direto e com salvamento online.</p></div><button class="btn secondary" id="reload">↻ Atualizar</button></div>${state.locked?'<div class="alert">As avaliações foram encerradas pela coordenação. Os registros podem ser consultados, mas não alterados.</div>':''}<div class="stats">${stat('Trabalhos designados',works.length)}${stat('Avaliados',done)}${stat('Pendentes',works.length-done)}${stat('Concluído',works.length?Math.round(done/works.length*100)+'%':'0%')}</div><div class="progress"><i style="width:${works.length?100*done/works.length:0}%"></i></div>${searchBar()}<div class="list" id="works"></div><div class="foot">A avaliação é individual. As notas das demais avaliadoras não são exibidas.</div>`;$('reload').onclick=()=>refresh();wireSearch(drawReviewerList);drawReviewerList();}
function drawReviewerList(){let map=new Map(state.grades.map(g=>[g.trabalho_id,g]));let works=filtered(state.works,w=>map.has(w.id)?'concluido':'pendente');$('works').innerHTML=works.map(w=>{const g=map.get(w.id);const total=g?g.clareza+g.publico+g.viabilidade+g.impacto:0;return `<article class="work"><div><div class="meta"><span class="pill">Grupo ${h(w.grupo)}</span><span>${h(w.horario)} h</span><span>Inscrição ${w.id}</span>${g?'<span class="pill done">Avaliado</span>':'<span class="pill wait">Pendente</span>'}</div><h3>${h(w.titulo)}</h3><p>${h(w.autor)}</p></div><div class="actions">${g?`<div class="score">${total}<span class="muted small">/20</span></div>`:''}<button class="btn smallbtn ${g?'secondary':''}" data-open="${w.id}">${g?'Ver / editar':'Avaliar agora'}</button></div></article>`}).join('')||'<div class="empty">Nenhum trabalho encontrado nesse filtro.</div>';$('works').querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openReview(Number(b.dataset.open)))}
const questions=[['clareza','Explicou claramente o plano?','Clareza da comunicação'],['publico','Escolheu bem o público-alvo?','Pertinência do público-alvo'],['viabilidade','O que propõe é possível fazer?','Viabilidade das estratégias'],['impacto','Vai beneficiar a sociedade?','Potencial de impacto social']];
function openReview(id){const work=state.works.find(w=>w.id===id);if(!work)return;opened=id;const grade=state.grades.find(g=>g.trabalho_id===id)||{};$('overlay').className='modalwrap';$('overlay').innerHTML=`<section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="top"><div><div class="kicker">Inscrição ${work.id} · Grupo ${h(work.grupo)} · ${h(work.horario)} h</div><h2 id="modalTitle">${h(work.titulo)}</h2><p class="muted">${h(work.autor)}</p></div><button id="closeModal" class="btn secondary smallbtn">Fechar ✕</button></div>${state.locked?'<div class="alert">Avaliações encerradas. Consulta somente.</div>':''}<form id="gradeForm"><div class="questions">${questions.map(([key,q,official],ix)=>`<div class="question"><div class="qtitle">${ix+1}. ${h(q)}</div><div class="choices" role="group" aria-label="${h(official)}">${[0,1,2,3,4,5].map(n=>`<button type="button" data-key="${key}" data-val="${n}" class="choice" aria-pressed="${grade[key]===n}" ${state.locked?'disabled':''}>${n}</button>`).join('')}</div><div class="small muted" style="margin-top:9px">${h(official)} · máximo 5 pontos</div></div>`).join('')}</div><label for="comment" style="display:block;font-weight:700;margin:16px 0 8px">Comentário (opcional)</label><textarea class="field" id="comment" maxlength="1500" placeholder="Uma observação breve, se necessário" ${state.locked?'disabled':''}>${h(grade.comentario||'')}</textarea><div class="top" style="align-items:center;margin-top:18px"><div><div class="muted small">Total desta avaliação</div><div class="score" id="liveTotal">${['clareza','publico','viabilidade','impacto'].every(k=>Number.isInteger(grade[k]))?grade.clareza+grade.publico+grade.viabilidade+grade.impacto:'–'} <span class="muted small">/ 20</span></div></div><button id="save" type="submit" class="btn success" ${state.locked?'disabled':''}>${grade.trabalho_id?'Atualizar avaliação':'Salvar avaliação'}</button></div></form></section>`;
const vals={};for(const k of ['clareza','publico','viabilidade','impacto']) if(Number.isInteger(grade[k])) vals[k]=grade[k];$('closeModal').onclick=closeModal;$('overlay').onclick=e=>{if(e.target===$('overlay'))closeModal()};$('overlay').querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{vals[b.dataset.key]=Number(b.dataset.val);$('overlay').querySelectorAll(`[data-key="${b.dataset.key}"]`).forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));const keys=['clareza','publico','viabilidade','impacto'];$('liveTotal').innerHTML=keys.every(k=>Number.isInteger(vals[k]))?`${keys.reduce((s,k)=>s+vals[k],0)} <span class="small muted">/ 20</span>`:'– <span class="small muted">/ 20</span>';});$('gradeForm').onsubmit=async e=>{e.preventDefault();if(!['clareza','publico','viabilidade','impacto'].every(k=>Number.isInteger(vals[k]))){notify('Escolha uma nota para cada uma das quatro perguntas.',true);return;}const b=$('save');b.disabled=true;b.textContent='Salvando...';try{await request('save',{work_id:id,...vals,comentario:$('comment').value});closeModal();await refresh();notify('Avaliação salva com sucesso.');}catch(e){notify(e.message,true);b.disabled=false;b.textContent='Salvar avaliação';}};}
function closeModal(){opened=null;$('overlay').className='hidden';$('overlay').innerHTML='';}
function reviewerLabel(id){return state.reviewers.find(r=>r.id===id)?.nome||id}
function coordStats(){const total=state.allocations.length,done=state.grades.length,complete=state.works.filter(w=>state.allocations.filter(a=>a.trabalho_id===w.id).every(a=>state.grades.some(g=>g.trabalho_id===w.id&&g.avaliador_id===a.avaliador_id))).length;return {total,done,complete}}
function renderCoord(){const t=coordStats();$('app').innerHTML=`<div class="top"><div><div class="kicker">Painel exclusivo da coordenação</div><h1>Monitoramento das avaliações</h1><p class="muted">Acompanhamento da banca. Médias exibidas somente após as duas notas.</p></div><div class="actionsbar"><button class="btn secondary" id="csv">↓ Exportar CSV</button><button class="btn secondary" id="reload">↻ Atualizar</button><button class="btn ${state.locked?'secondary':'danger'}" id="lock">${state.locked?'Reabrir notas':'Encerrar notas'}</button></div></div>${state.locked?'<div class="alert">Avaliações encerradas. Nenhuma avaliadora poderá alterar suas notas até a reabertura.</div>':''}<div class="stats">${stat('Trabalhos',state.works.length)}${stat('Notas recebidas',`${t.done}/${t.total}`)}${stat('Trabalhos completos',t.complete)}${stat('Faltam avaliações',t.total-t.done)}</div><div class="progress"><i style="width:${t.total?100*t.done/t.total:0}%"></i></div><div class="notice"><strong>Andamento por avaliadora:</strong> <span id="assessProgress"></span></div>${searchBar()}<div id="coordList"></div><p class="foot">Média = soma das duas notas / 2. Em caso de empate: impacto social, depois viabilidade. Confirme o procedimento de consolidação com a comissão organizadora.</p>`;$('reload').onclick=()=>refresh();$('csv').onclick=downloadCSV;$('lock').onclick=async()=>{let next=!state.locked;if(!confirm(next?'Deseja encerrar e bloquear todas as avaliações?':'Deseja reabrir as avaliações?'))return;try{await request('lock',{locked:next});await refresh();notify(next?'Avaliações encerradas.':'Avaliações reabertas.');}catch(e){notify(e.message,true)}};$('assessProgress').innerHTML=state.reviewers.map(r=>{let total=state.allocations.filter(a=>a.avaliador_id===r.id).length,done=state.grades.filter(g=>g.avaliador_id===r.id).length;return `<span class="pill" style="margin:3px">${h(r.nome)}: ${done}/${total}</span>`}).join('');wireSearch(drawCoordList);drawCoordList();}
function getWorkGrades(w){const assigned=state.allocations.filter(a=>a.trabalho_id===w.id);const received=assigned.map(a=>state.grades.find(g=>g.trabalho_id===w.id&&g.avaliador_id===a.avaliador_id)).filter(Boolean);const complete=received.length===assigned.length&&assigned.length===2;const mean=complete?received.reduce((s,g)=>s+g.clareza+g.publico+g.viabilidade+g.impacto,0)/2:null;return {assigned,received,complete,mean}}
function drawCoordList(){const works=filtered(state.works,w=>getWorkGrades(w).complete?'concluido':'pendente');$('coordList').innerHTML=`<div class="tablewrap"><table><thead><tr><th>Grupo / horário</th><th>Trabalho e estudante</th><th>Avaliadores</th><th>Concluído</th><th class="right">Média /20</th><th></th></tr></thead><tbody>${works.map(w=>{const g=getWorkGrades(w);return `<tr><td><span class="pill">${h(w.grupo)}</span><br><br>${h(w.horario)} h</td><td><strong>${h(w.titulo)}</strong><div class="small muted" style="margin-top:5px">${h(w.autor)} · #${w.id}</div></td><td>${g.assigned.map(a=>{const scored=g.received.some(x=>x.avaliador_id===a.avaliador_id);return `<div style="margin-bottom:6px">${scored?'✓':'○'} ${h(reviewerLabel(a.avaliador_id))}</div>`}).join('')}</td><td><span class="pill ${g.complete?'done':'wait'}">${g.received.length}/2</span></td><td class="right"><strong>${g.complete?numeric(g.mean):'–'}</strong></td><td><button data-details="${w.id}" class="link">Detalhes</button></td></tr>`}).join('')}</tbody></table>${works.length?'':'<div class="empty">Nenhum trabalho encontrado.</div>'}</div>`;$('coordList').querySelectorAll('[data-details]').forEach(b=>b.onclick=()=>showDetails(Number(b.dataset.details)));}
function showDetails(id){const w=state.works.find(w=>w.id===id),x=getWorkGrades(w);$('overlay').className='modalwrap';$('overlay').innerHTML=`<section class="modal" role="dialog" aria-modal="true"><div class="top"><div><div class="kicker">Inscrição #${w.id} · Grupo ${h(w.grupo)}</div><h2>${h(w.titulo)}</h2><p class="muted">${h(w.autor)}</p></div><button id="closeModal" class="btn secondary smallbtn">Fechar ✕</button></div>${x.assigned.map(a=>{const g=x.received.find(z=>z.avaliador_id===a.avaliador_id);return `<div class="notice"><strong>${h(reviewerLabel(a.avaliador_id))}</strong><div class="muted small">${g?'Nota registrada em '+new Date(g.atualizado_em).toLocaleString('pt-BR'):'Avaliação pendente'}</div>${g?`<p style="margin:12px 0 6px">Clareza ${g.clareza} · Público ${g.publico} · Viabilidade ${g.viabilidade} · Impacto ${g.impacto}</p><strong>Total: ${g.clareza+g.publico+g.viabilidade+g.impacto}/20</strong>${g.comentario?`<p class="muted" style="margin-top:10px">${h(g.comentario)}</p>`:''}`:''}</div>`}).join('')}<div class="box" style="box-shadow:none"><strong>${x.complete?'Média consolidada: '+numeric(x.mean)+'/20':'Aguardando as duas avaliações'}</strong></div></section>`;$('closeModal').onclick=closeModal;$('overlay').onclick=e=>{if(e.target===$('overlay'))closeModal()};}
function downloadCSV(){const head=['Inscricao','Grupo','Horario','Autor','Titulo','Avaliador','Clareza','Publico','Viabilidade','Impacto','Total','Comentario','Atualizado_em','Media_trabalho'];const lines=[head];for(const w of state.works){const gs=getWorkGrades(w);for(const a of gs.assigned){const g=gs.received.find(x=>x.avaliador_id===a.avaliador_id);lines.push([w.id,w.grupo,w.horario,w.autor,w.titulo,reviewerLabel(a.avaliador_id),g?.clareza??'',g?.publico??'',g?.viabilidade??'',g?.impacto??'',g?g.clareza+g.publico+g.viabilidade+g.impacto:'',g?.comentario??'',g?.atualizado_em??'',gs.complete?gs.mean:'']);}}const csv='\uFEFF'+lines.map(row=>row.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(';')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='Avaliacoes_SAPI_2026.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
if(token)refresh();else renderLogin();setInterval(()=>{if(token&&state?.user.papel==='coordenacao'&&$('overlay').className==='hidden')refresh(true);},30000);
</script></body></html>
